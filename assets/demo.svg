<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="16" in="SourceAlpha"/>
      <feOffset dx="0" dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e222b"/>
      <stop offset="100%" stop-color="#161922"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
  </defs>

  <!-- Window Container with Drop Shadow -->
  <rect x="20" y="20" width="840" height="500" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Window Header Bar -->
  <path d="M 20 32 Q 20 20 32 20 L 848 20 Q 860 20 860 32 L 860 62 L 20 62 Z" fill="url(#headerGrad)"/>
  <line x1="20" y1="62" x2="860" y2="62" stroke="#30363d" stroke-width="1"/>

  <!-- Window Controls (Red, Yellow, Green) -->
  <circle cx="44" cy="41" r="6" fill="#ff5f56"/>
  <circle cx="64" cy="41" r="6" fill="#ffbd2e"/>
  <circle cx="84" cy="41" r="6" fill="#27c93f"/>

  <!-- Window Title -->
  <text x="440" y="45" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">pocketbridge — zsh — 88x26</text>

  <!-- Terminal Content -->
  <g font-family="'JetBrains Mono', 'Fira Code', 'Cascadia Code', Menlo, Monaco, Consolas, monospace" font-size="13" line-height="1.5">
    <!-- Prompt Line -->
    <text x="45" y="94">
      <tspan fill="#4ade80" font-weight="bold">pirate@arch-zen</tspan>
      <tspan fill="#8b949e">:</tspan>
      <tspan fill="#38bdf8">~/PocketBridge</tspan>
      <tspan fill="#f43f5e">$</tspan>
      <tspan fill="#f0f6fc"> pocketbridge run -a chunk_transform --records 1000000 --hybrid</tspan>
    </text>

    <!-- Execution Status & Handshake -->
    <text x="45" y="124" fill="#a5d6ff"><tspan fill="#38bdf8">[+]</tspan> Connecting to USB worker at 127.0.0.1:9876 via ADB tunnel...</text>
    <text x="45" y="146" fill="#a5d6ff"><tspan fill="#38bdf8">[✓]</tspan> Worker online: <tspan fill="#e3b341" font-weight="bold">Samsung Galaxy S25 Ultra</tspan> (Qualcomm Snapdragon 8 Elite, 8 Oryon cores)</text>
    <text x="45" y="168" fill="#a5d6ff"><tspan fill="#38bdf8">[✓]</tspan> Link status: <tspan fill="#7ee787">USB-C 3.2 Gen 1</tspan> | Baseline RTT: <tspan fill="#7ee787">0.18 ms</tspan> | Bandwidth: <tspan fill="#7ee787">128.4 MB/s</tspan></text>
    <text x="45" y="190" fill="#a5d6ff"><tspan fill="#38bdf8">[i]</tspan> Thermal headroom: <tspan fill="#7ee787">Normal (0.82)</tspan> | Battery: <tspan fill="#7ee787">88% (Charging AC)</tspan> | WakeLock: <tspan fill="#7ee787">Acquired</tspan></text>

    <!-- Workload Distribution -->
    <text x="45" y="222" fill="#d29922">⚙ Dynamic Partition Ratio Calibration:</text>
    <text x="65" y="244" fill="#c9d1d9">├── Host (Intel Core i5-13420H):  <tspan fill="#58a6ff" font-weight="bold">493,000 records (49.3%)</tspan> ➔ Local AVX2</text>
    <text x="65" y="266" fill="#c9d1d9">└── Worker (Snapdragon 8 Elite):  <tspan fill="#3fb950" font-weight="bold">507,000 records (50.7%)</tspan> ➔ ARM NEON SIMD</text>

    <!-- Progress Bar -->
    <text x="45" y="298" fill="#7ee787">[==================================================] 100% (1,000,000 / 1,000,000)</text>

    <!-- Summary Box -->
    <path d="M 45 316 L 835 316" stroke="#30363d" stroke-width="1" stroke-dasharray="4"/>
    <text x="45" y="340" fill="#f0883e" font-weight="bold">📊 EXECUTION BENCHMARK SUMMARY</text>
    
    <text x="65" y="364" fill="#8b949e">Host Compute Time:       <tspan fill="#f0f6fc">238.10 ms</tspan> <tspan fill="#484f58">(Intel AVX2)</tspan></text>
    <text x="65" y="386" fill="#8b949e">Phone Compute Time:      <tspan fill="#f0f6fc">241.50 ms</tspan> <tspan fill="#484f58">(Snapdragon 8 Elite ARM NEON)</tspan></text>
    <text x="65" y="408" fill="#8b949e">Concurrent Wall-Clock:   <tspan fill="#7ee787" font-weight="bold">247.90 ms</tspan> <tspan fill="#484f58">(both devices computing in parallel)</tspan></text>
    <text x="65" y="430" fill="#8b949e">Combined Throughput:     <tspan fill="#7ee787" font-weight="bold">4,033,884 records/sec</tspan></text>
    
    <text x="65" y="456" fill="#8b949e">Single-Host Baseline:    <tspan fill="#f85149">421.50 ms</tspan> <tspan fill="#484f58">(Laptop only execution)</tspan></text>
    <text x="65" y="478" fill="#8b949e">Measured Co-Op Speedup:  <tspan fill="#38bdf8" font-weight="bold">1.70x faster</tspan> <tspan fill="#58a6ff">(+70.0% throughput gain over laptop alone)</tspan></text>
    <text x="65" y="500" fill="#8b949e">Result Verification:     <tspan fill="#7ee787">SHA-256 Validated</tspan> <tspan fill="#484f58">(d8c83a1f9e21... bit-exact output)</tspan></text>
  </g>
</svg>
